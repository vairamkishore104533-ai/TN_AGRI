{% extends "base.html" %}
{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card scale-in">
            <div class="auth-header">
                <div class="auth-logo">🌾 <span>AI Agriculture Assistant</span></div>
                <h1>{{ t('login_title') }}</h1>
                <p>{{ t('login_subtitle') }}</p>
            </div>
            <div class="auth-error" id="auth-error"></div>
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label>{{ t('login_username') }}</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" name="username" placeholder="{{ t('login_username') }}" required minlength="4">
                    </div>
                </div>
                <div class="form-group">
                    <label>{{ t('login_password') }}</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" placeholder="{{ t('login_password') }}" required minlength="4">
                    </div>
                </div>
                <button type="submit" class="btn-submit">{{ t('login_btn') }}</button>
            </form>
            <div class="auth-footer">
                <p>{{ t('login_no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('login_register_link') }}</a></p>
            </div>
            <div style="text-align:center;margin-top:16px">
                <button class="lang-toggle" onclick="setLanguage('{{ "ta" if lang == "en" else "en" }}')" style="display:inline-flex">
                    🌐 <span>{{ "English" if lang == "ta" else "தமிழ்" }}</span>
                </button>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const data = {
        username: this.username.value,
        password: this.password.value,
        lang: "{{ lang }}"
    };
    const btn = this.querySelector(".btn-submit");
    btn.disabled = true;
    btn.textContent = "{{ t('please_wait') }}";
    document.getElementById("auth-error").classList.remove("active");

    fetch("{{ url_for('auth.login') }}", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
        btn.disabled = false;
        btn.textContent = "{{ t('login_btn') }}";
        if (res.success) {
            window.location.href = res.redirect;
        } else {
            const errorEl = document.getElementById("auth-error");
            errorEl.textContent = res.message;
            errorEl.classList.add("active");
        }
    })
    .catch(() => {
        btn.disabled = false;
        btn.textContent = "{{ t('login_btn') }}";
        const errorEl = document.getElementById("auth-error");
        errorEl.textContent = "{{ t('error_occurred') }}";
        errorEl.classList.add("active");
    });
});
</script>
{% endblock %}
